# devices/davinci/device.conf: what this device repository is (docs/porting/repositories.md has every word).
# The status lines are what was seen on the phone; docs/MIGRATION.md says which part has been seen again since the
# port moved into this repository (from hackios-xnu-kernel-davinci, davinci-metal 6d40948) and which not yet.

device davinci
	title       Xiaomi Mi 9T / Redmi K20
	vendor      Xiaomi
	soc         sm7150
	defconfig   davinci_defconfig
	firmware    pull-firmware.sh
	maintainer  xorbidden (README.md)
	status      display     works     the panel driven by the kernel (DSI, panel_on=1, CONFIG_HAKIOS_DSI); frames drawn by the Adreno 618 (gpu=1), two framebuffers, no tearing
	status      touch       works     Goodix GT9886 on I2C, multitouch (touchscreen=1, CONFIG_HAKIOS_GT9886)
	status      buttons     works     power and volume down from the PM6150's power-on block, volume up from PM6150L GPIO 2 (pmic_pon=0x008 pmic_volume_up=0x4c1)
	status      cpu         works     all 8 cores at their top speed through the OSM (cpus=8 bootcpu=7 cpufreq=1, CONFIG_HAKIOS_CPUFREQ_OSM)
	status      gpu         works     Adreno 618 with its GMU, OpenGL ES through Mesa (gpu=1, CONFIG_HAKIOS_A618 as the Adreno driver's backend); no Metal
	status      storage     partial   read through the loader; the kernel's own UFS driver goes as far as the first doorbell
	status      audio       works     speaker (TFA9874) and microphone (bolero 1.x, Voice Memos) through the audio DSP (adsp=1 sound=4 mic=4, CONFIG_HAKIOS_ADSP_SM7150)
	status      battery     works     level and the charging bolt, from the UEFI's Qualcomm charger drivers (battery=1)
	status      haptic      works     the PM6150's vibrator LDO following iOS's haptics (haptic=3, CONFIG_HAKIOS_VIBRATOR)
	status      camera      works     main IMX582 and the pop-up front S5K3T2 in Camera.app (cam=5, CONFIG_HAKIOS_CAM_DAVINCI); no focus motor, tele or ultra-wide
	status      torch       works     the PM6150L flash LED from Control Center (torch=3 pmic_flash=0x5d3)
	status      wifi        partial   WCN3990 with Linux's ath10k, WPA2-Personal joined, iOS sees the network (wifi_ath10k=1 wifi_smmu=2 wifi_station=1, CONFIG_HAKIOS_WIFI_SM7150); only in a session started from Android
	status      bluetooth   partial   the WCN3990's controller patched and reset (bt=5, CONFIG_HAKIOS_BT_WCN3990); iOS does not use it yet
	status      cellular    missing   the modem runs beside the audio DSP (adsp_modem=1) for the Wi-Fi's firmware; no SIM, no network
	status      sensors     missing   the DSP's sensors process is started; iOS gets nothing from it
